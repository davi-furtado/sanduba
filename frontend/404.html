<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Página não encontrada | Sanduba Lanches</title>

    <script>
      const sandubaBasePath = location.pathname.startsWith('/sanduba/')
        ? '/sanduba/'
        : '/'
      const icon = document.createElement('link')
      icon.rel = 'icon'
      icon.href = `${sandubaBasePath}favicon.ico`
      document.head.appendChild(icon)
      for (const href of [
        'css/bootstrap.min.css',
        'css/bootstrap-icons.css',
        'css/style.css',
      ]) {
        const stylesheet = document.createElement('link')
        stylesheet.rel = 'stylesheet'
        stylesheet.href = `${sandubaBasePath}${href}`
        document.head.appendChild(stylesheet)
      }
    </script>
  </head>

  <body>
    <nav class="navbar bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand fw-bold" data-home href="#body">
          <span class="text-warning">Sanduba</span> Lanches
        </a>

        <button
          id="themeToggle"
          class="btn btn-outline-warning"
          type="button"
          aria-label="Alternar tema"
        >
          <i class="bi bi-sun-fill"></i>
        </button>
      </div>
    </nav>

    <main class="min-vh-100 d-flex align-items-center">
      <div class="container text-center">
        <div class="display-1 fw-bold text-warning">404</div>

        <h1 class="fw-bold mt-3">Página não encontrada</h1>

        <p class="lead text-body-secondary">
          Parece que esse lanche foi parar no lugar errado.
        </p>

        <a data-home href="#body" class="btn btn-warning fw-bold mt-3">
          Voltar para o início
        </a>
      </div>
    </main>

    <script>
      document.write(
        `<script src="${sandubaBasePath}js/bootstrap.bundle.min.js"><\/script>`,
      )
      document.write(
        `<script src="${sandubaBasePath}js/main.js"><\/script>`,
      )
      document.write(
        `<script src="${sandubaBasePath}js/404-links.js"><\/script>`,
      )
    </script>
  </body>
</html>
