<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Página não encontrada | Sanduba Lanches</title>

  </head>

  <body>
    <nav class="navbar bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand fw-bold" data-home href="#body">
          <span class="text-warning">Sanduba</span> Lanches
        </a>

        <button
          id="themeToggle"
          class="btn btn-outline-warning"
          type="button"
          aria-label="Alternar tema"
        >
          <i class="bi bi-sun-fill"></i>
        </button>
      </div>
    </nav>

    <main class="min-vh-100 d-flex align-items-center">
      <div class="container text-center">
        <div class="display-1 fw-bold text-warning">404</div>

        <h1 class="fw-bold mt-3">Página não encontrada</h1>

        <p class="lead text-body-secondary">
          Parece que esse lanche foi parar no lugar errado.
        </p>

        <a data-home href="#body" class="btn btn-warning fw-bold mt-3">
          Voltar para o início
        </a>
      </div>
    </main>

    <script>
      const sandubaAssetBasePath = location.pathname.startsWith('/sanduba/')
        ? '/sanduba/'
        : '/'
      const sandubaAppendLink = (rel, href) => {
        const link = document.createElement('link')
        link.rel = rel
        link.href = `${sandubaAssetBasePath}${href}`
        document.head.appendChild(link)
      }
      const sandubaAppendScript = (src) => {
        const script = document.createElement('script')
        script.src = `${sandubaAssetBasePath}${src}`
        document.body.appendChild(script)
      }

      sandubaAppendLink('icon', 'favicon.ico')
      sandubaAppendLink('stylesheet', 'css/bootstrap.min.css')
      sandubaAppendLink('stylesheet', 'css/bootstrap-icons.css')
      sandubaAppendLink('stylesheet', 'css/style.css')
      sandubaAppendScript('js/404.js')
    </script>
  </body>
</html>
