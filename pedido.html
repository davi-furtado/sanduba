<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fazer pedido| Sanduba Lanches</title>

    <link rel="icon" href="favicon.ico" />
      <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <span class="text-warning">Sanduba</span> Lanches
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarPrincipal"
          aria-label="Abrir menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarPrincipal">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Início </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="cardapio.html">Cardápio</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="pedido.html"> Fazer pedido</a>
            </li>

            <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
              <button
                id="themeToggle"
                class="btn btn-outline-warning"
                type="button"
                aria-label="Alternar tema"
              >
                <i class="bi bi-sun-fill"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <section class="py-5">
        <div class="container">
          <div class="text-center mb-5">
            <h1 class="fw-bold">
              Faça seu <span class="text-warning">pedido</span>
            </h1>

            <p class="text-body-secondary">
              Preencha os dados abaixo para montar seu pedido.
            </p>
          </div>

          <div class="row justify-content-center">
            <div class="col-lg-8">
              <form>
                <!-- Dados do cliente -->
                <div class="card mb-4">
                  <div class="card-header">
                    <h2 class="h5 mb-0">Dados do cliente</h2>
                  </div>

                  <div class="card-body">
                    <div class="mb-3">
                      <label for="nome" class="form-label">
                        Nome completo
                      </label>

                      <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                      />
                    </div>

                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label for="telefone" class="form-label">
                          Telefone
                        </label>

                        <input
                          type="tel"
                          class="form-control"
                          id="telefone"
                          name="telefone"
                          placeholder="(00) 00000-0000"
                          required
                        />
                      </div>

                      <div class="col-md-6 mb-3">
                        <label for="email" class="form-label"> E-mail </label>

                        <input
                          type="email"
                          class="form-control"
                          id="email"
                          name="email"
                          placeholder="seu@email.com"
                        />
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Pedido -->
                <div class="card mb-4">
                  <div class="card-header">
                    <h2 class="h5 mb-0">Seu pedido</h2>
                  </div>

                  <div class="card-body">
                    <div class="mb-3">
                      <label for="produto" class="form-label">
                        Escolha o produto
                      </label>

                      <select
                        class="form-select"
                        id="produto"
                        name="produto"
                        required
                      >
                        <option value="">Selecione um produto</option>

                        <option value="x-burger">
                          X-Burger Especial - R$ 22,90
                        </option>

                        <option value="x-salada">X-Salada - R$ 19,90</option>

                        <option value="x-bacon">X-Bacon - R$ 24,90</option>

                        <option value="batata">
                          Batata Crocante - R$ 14,90
                        </option>

                        <option value="refrigerante">
                          Refrigerante - R$ 6,00
                        </option>
                      </select>
                    </div>

                    <div class="mb-3">
                      <label for="quantidade" class="form-label">
                        Quantidade
                      </label>

                      <input
                        type="number"
                        class="form-control"
                        id="quantidade"
                        name="quantidade"
                        min="1"
                        max="20"
                        value="1"
                        required
                      />
                    </div>

                    <div class="mb-3">
                      <label for="observacoes" class="form-label">
                        Observações
                      </label>

                      <textarea
                        class="form-control"
                        id="observacoes"
                        name="observacoes"
                        rows="4"
                        placeholder="Ex.: Sem cebola, pouco molho..."
                      ></textarea>
                    </div>
                  </div>
                </div>

                <!-- Entrega -->
                <div class="card mb-4">
                  <div class="card-header">
                    <h2 class="h5 mb-0">Forma de recebimento</h2>
                  </div>

                  <div class="card-body">
                    <div class="form-check mb-2">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="recebimento"
                        id="retirada"
                        value="retirada"
                        required
                      />

                      <label class="form-check-label" for="retirada">
                        Retirar na lanchonete
                      </label>
                    </div>

                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="recebimento"
                        id="entrega"
                        value="entrega"
                      />

                      <label class="form-check-label" for="entrega">
                        Entrega
                      </label>
                    </div>
                  </div>
                </div>

                <!-- Endereço -->
                <div class="card mb-4">
                  <div class="card-header">
                    <h2 class="h5 mb-0">Endereço de entrega</h2>
                  </div>

                  <div class="card-body">
                    <div class="row">
                      <div class="col-md-8 mb-3">
                        <label for="rua" class="form-label"> Rua </label>

                        <input
                          type="text"
                          class="form-control"
                          id="rua"
                          name="rua"
                        />
                      </div>

                      <div class="col-md-4 mb-3">
                        <label for="numero" class="form-label"> Número </label>

                        <input
                          type="number"
                          class="form-control"
                          id="numero"
                          name="numero"
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label for="bairro" class="form-label"> Bairro </label>

                        <input
                          type="text"
                          class="form-control"
                          id="bairro"
                          name="bairro"
                        />
                      </div>

                      <div class="col-md-6 mb-3">
                        <label for="complemento" class="form-label">
                          Complemento
                        </label>

                        <input
                          type="text"
                          class="form-control"
                          id="complemento"
                          name="complemento"
                        />
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Pagamento -->
                <div class="card mb-4">
                  <div class="card-header">
                    <h2 class="h5 mb-0">Forma de pagamento</h2>
                  </div>

                  <div class="card-body">
                    <div class="form-check mb-2">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="pagamento"
                        id="pix"
                        value="pix"
                        required
                      />

                      <label class="form-check-label" for="pix"> Pix </label>
                    </div>

                    <div class="form-check mb-2">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="pagamento"
                        id="dinheiro"
                        value="dinheiro"
                      />

                      <label class="form-check-label" for="dinheiro">
                        Dinheiro
                      </label>
                    </div>

                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="pagamento"
                        id="cartao"
                        value="cartao"
                      />

                      <label class="form-check-label" for="cartao">
                        Cartão
                      </label>
                    </div>
                  </div>
                </div>

                <!-- Confirmação -->
                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="confirmacao"
                    required
                  />

                  <label class="form-check-label" for="confirmacao">
                    Confirmo que os dados do pedido estão corretos.
                  </label>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-warning fw-bold">
                    Enviar pedido
                  </button>

                  <button type="reset" class="btn btn-outline-secondary">
                    Limpar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="py-4">
      <div class="container text-center">
        <strong>Sanduba Lanches</strong>

        <p class="text-body-secondary mb-0 mt-2">
          Sabor que dá vontade de repetir.
        </p>
      </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
